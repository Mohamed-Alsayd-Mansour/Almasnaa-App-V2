name: Almasnaa Flutter CI and Builds

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: almasnaa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Verify Supabase client configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure SUPABASE_URL and SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Set Gradle distribution URL
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_FILE" ]; then
            echo "::error::Gradle wrapper file not found: $WRAPPER_FILE"
            exit 1
          fi
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' "$WRAPPER_FILE"
          echo "Gradle distribution configured as:"
          grep '^distributionUrl=' "$WRAPPER_FILE"

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almasnaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs: validate
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Verify Supabase client configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure SUPABASE_URL and SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web release
        shell: bash
        run: |
          flutter build web --release \
            --base-href "/Almasnaa-App-V2/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: almasnaa-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 14
    
      - name: Deploy latest Web version to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/web

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: validate
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Verify Supabase client configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            Write-Error "Configure SUPABASE_URL and SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Variables."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" `
            "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"

      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            Write-Error "Windows release folder not found: $releaseDir"
            exit 1
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "Almasnaa-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: almasnaa-windows-release
          path: Almasnaa-Windows.zip
          if-no-files-found: error
          retention-days: 14
